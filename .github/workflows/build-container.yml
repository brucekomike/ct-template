name: Build and Push Container Image

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  release:
    types: [published]
  schedule:
    - cron: '0 0 * * 0'

env:
  REGISTRY: ghcr.io
  AMD64_ONLY_DOCKERFILES: 'Dockerfile.amd64.1'

jobs:
  detect-dockerfiles:
    name: Detect Dockerfiles
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix-stage-0: ${{ steps.find.outputs.matrix-stage-0 }}
      matrix-stage-1: ${{ steps.find.outputs.matrix-stage-1 }}
      matrix-stage-2: ${{ steps.find.outputs.matrix-stage-2 }}
      matrix-stage-3: ${{ steps.find.outputs.matrix-stage-3 }}
      matrix-stage-4: ${{ steps.find.outputs.matrix-stage-4 }}
      merge-matrix-stage-0: ${{ steps.find.outputs.merge-matrix-stage-0 }}
      merge-matrix-stage-1: ${{ steps.find.outputs.merge-matrix-stage-1 }}
      merge-matrix-stage-2: ${{ steps.find.outputs.merge-matrix-stage-2 }}
      merge-matrix-stage-3: ${{ steps.find.outputs.merge-matrix-stage-3 }}
      merge-matrix-stage-4: ${{ steps.find.outputs.merge-matrix-stage-4 }}
      has-stage-0: ${{ steps.find.outputs.has-stage-0 }}
      has-stage-1: ${{ steps.find.outputs.has-stage-1 }}
      has-stage-2: ${{ steps.find.outputs.has-stage-2 }}
      has-stage-3: ${{ steps.find.outputs.has-stage-3 }}
      has-stage-4: ${{ steps.find.outputs.has-stage-4 }}
      max-stage: ${{ steps.find.outputs.max-stage }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Find all Dockerfiles
        id: find
        run: |
          # Discover every Dockerfile* and compute a "stage" for each one, based on a
          # trailing numeric suffix (e.g. "Dockerfile.foo.1" -> stage 1, "Dockerfile" -> stage 0).
          all=$(find . -type f -name "Dockerfile*" -not -path "./.git/*" | sort | \
            jq -Rsc --arg amd64_only "${AMD64_ONLY_DOCKERFILES}" '
              ($amd64_only | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))) as $amd64_only_list |
              [
              split("\n")[] | select(length > 0) | . as $f |
              (. | split("/")[-1]) as $name |
              (if $name == "Dockerfile" then "" else ($name | ltrimstr("Dockerfile.")) end) as $full_rest |
              ($full_rest | split(".")) as $parts |
              (if $full_rest == "" then {stage: 0, rest: ""}
               elif ($parts[-1] | test("^[0-9]+$")) then {stage: ($parts[-1] | tonumber), rest: ($parts[0:-1] | join("."))}
               else {stage: 0, rest: $full_rest}
               end) as $r |
              (if $r.rest == "" then "" else "-" + $r.rest end) as $suffix |
              (if (($amd64_only_list | index($f)) != null or ($amd64_only_list | index($name)) != null) then ["amd64"] else ["amd64", "arm64"] end) as $archs |
              {"dockerfile": $f, "suffix": $suffix, "archs": $archs, "stage": $r.stage}
            ]')

          max_stage=$(echo "$all" | jq '[.[].stage] | max // 0')
          echo "max-stage=$max_stage" >> "$GITHUB_OUTPUT"
          if [ "$max_stage" -gt 4 ]; then
            echo "::warning::Found a Dockerfile with stage $max_stage, but only stages 0-4 (suffixes .1-.4) have build jobs. Dockerfiles beyond stage 4 will not be built."
          fi

          for i in 0 1 2 3 4; do
            m=$(echo "$all" | jq -c --argjson i "$i" '{include: [.[] | select(.stage == $i) | . as $e | $e.archs[] | {dockerfile: $e.dockerfile, suffix: $e.suffix, arch: ., platform: ("linux/" + .), runner: (if . == "arm64" then "ubuntu-24.04-arm" else "ubuntu-latest" end)}]}')
            mm=$(echo "$all" | jq -c --argjson i "$i" '{include: [.[] | select(.stage == $i) | {suffix: .suffix, archs: (.archs | join(" "))}]}')
            count=$(echo "$mm" | jq '.include | length')
            echo "matrix-stage-$i=$m" >> "$GITHUB_OUTPUT"
            echo "merge-matrix-stage-$i=$mm" >> "$GITHUB_OUTPUT"
            if [ "$count" -gt 0 ]; then
              echo "has-stage-$i=true" >> "$GITHUB_OUTPUT"
            else
              echo "has-stage-$i=false" >> "$GITHUB_OUTPUT"
            fi
          done

  build-stage-0:
    name: Build (${{ github.repository }}${{ matrix.suffix }}, ${{ matrix.arch }})
    needs: detect-dockerfiles
    if: needs.detect-dockerfiles.outputs.has-stage-0 == 'true'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-dockerfiles.outputs.matrix-stage-0) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}${{ matrix.suffix }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=,format=short
          flavor: |
            suffix=-${{ matrix.arch }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push container image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          build-args: |
            BASE_IMAGE_FALLBACK_PREFIX=${{ env.REGISTRY }}/${{ github.repository_owner }}/
          push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: |
            type=gha,scope=${{ github.repository }}-${{ matrix.arch }}
            type=gha,scope=${{ github.repository }}${{ matrix.suffix || '-root' }}-${{ matrix.arch }}
          cache-to: |
            type=gha,scope=${{ github.repository }}-${{ matrix.arch }},mode=max
            type=gha,scope=${{ github.repository }}${{ matrix.suffix || '-root' }}-${{ matrix.arch }},mode=max

  merge-stage-0:
    name: Merge manifest (${{ github.repository }}${{ matrix.suffix }})
    needs: [detect-dockerfiles, build-stage-0]
    if: |
      always() &&
      needs.detect-dockerfiles.result == 'success' &&
      needs.detect-dockerfiles.outputs.has-stage-0 == 'true' &&
      needs.build-stage-0.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-dockerfiles.outputs.merge-matrix-stage-0) }}

    steps:
      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}${{ matrix.suffix }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create multi-arch manifests
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          ARCHS: ${{ matrix.archs }}
        run: |
          for tag in $TAGS; do
            sources=""
            for arch in $ARCHS; do
              sources="$sources ${tag}-${arch}"
            done
            docker buildx imagetools create -t "$tag" $sources
          done

  build-stage-1:
    name: Build (${{ github.repository }}${{ matrix.suffix }}, ${{ matrix.arch }})
    needs: [detect-dockerfiles, merge-stage-0]
    if: |
      always() &&
      needs.detect-dockerfiles.result == 'success' &&
      needs.detect-dockerfiles.outputs.has-stage-1 == 'true' &&
      (needs.merge-stage-0.result == 'success' || needs.detect-dockerfiles.outputs.has-stage-0 == 'false')
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-dockerfiles.outputs.matrix-stage-1) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to the Container registry
